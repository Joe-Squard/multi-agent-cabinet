# =============================================================================
# ホール設定 (Hall Configuration) — パラッツォ鳩ヶ谷
# =============================================================================
# 対象ホールの基本情報と傾向パラメータを定義します。
# 傾向値は「一般的なホール傾向の初期仮説」です。実データが蓄積されると
# hall_analyzer が学習した傾向で上書き・補正されます。
# =============================================================================

hall:
  id: palazzo_hatogaya
  name: "パラッツォ鳩ヶ谷"
  area: "埼玉県川口市"
  # 営業時間（判別の信頼度・残り期待値の計算に使用）
  open_hour: 9
  close_hour: 22.75      # 22:45 閉店を想定（分は小数で: 45/60=0.75）
  # 1日の平均稼働（1台あたりの想定総回転数の目安）
  typical_full_day_games: 8000

# -----------------------------------------------------------------------------
# 判別・推薦のしきい値（チューニング可能）
# -----------------------------------------------------------------------------
thresholds:
  # 「設定示唆」= 高設定(4以上)の事後確率がこの値以上
  likely_high_p: 0.55
  # 「激アツ」= 超高設定(5以上)の事後確率がこの値以上
  super_hot_p: 0.45
  # 「激アツ」= 設定6ピンポイントの事後確率がこの値以上（OR条件）
  super_hot_max6_p: 0.30
  # 統計的信頼度が十分とみなす総回転数（これ未満はconfidenceを減衰）
  reliable_games: 5000
  # 事前予想（データ前）のホールパターンで「注目」とする最低スコア
  watch_pattern_score: 0.5

# -----------------------------------------------------------------------------
# ホール傾向の初期仮説（学習前のデフォルト）
# -----------------------------------------------------------------------------
tendencies:
  # 末尾狙い: 特定末尾に高設定を入れやすいという仮説の初期重み
  # （実データ学習で更新される。0.0=傾向なし, 1.0=強い傾向）
  last_digit_bias_weight: 0.6
  # ゾロ目台（例: 111, 222, 777）を優遇する傾向
  repdigit_bias_weight: 0.7
  # 角台（シマ端）を優遇する傾向
  corner_bias_weight: 0.5
  # 特定機種（看板機種）に高設定を集中させる傾向
  flagship_model_weight: 0.6

  # 看板・強め機種（このホールで設定投入されやすいと仮定する機種）
  flagship_models:
    - my_juggler_v
    - gogo_juggler_3

  # シマ（島）定義: 台番号レンジで島を表現。角台判定に使用。
  # 実際の島構成に合わせて編集してください。
  islands:
    - name: "ジャグラー島A"
      range: [101, 120]
      models: [my_juggler_v, im_juggler_ex]
    - name: "ジャグラー島B"
      range: [121, 140]
      models: [funky_juggler_2, gogo_juggler_3]
    - name: "ジャグラー島C"
      range: [141, 156]
      models: [happy_juggler_v3, gogo_juggler_3]

# -----------------------------------------------------------------------------
# データソース設定
# -----------------------------------------------------------------------------
data_source:
  # kind: demo | file | web
  #   demo … 内蔵シミュレータで擬似データ生成（そのまま動作確認できる）
  #   file … data/raw/ 配下のCSV/JSONを読む
  #   web  … 外部データサイトを取得（下記 web を設定。ToS順守は利用者責任）
  kind: demo

  file:
    # kind=file のとき読むパス（{date} は当日 YYYY-MM-DD に置換）
    path: "data/raw/{date}.csv"

  web:
    # kind=web のとき。利用規約(robots.txt/ToS)を必ず確認してください。
    # 実サイトのHTMLは変わるため、parser は data_source.py の
    # WebDataSource を対象サイトに合わせて実装/調整する必要があります。
    enabled: false
    url: ""                      # 例: "https://example-data-site/hall/xxxx?date={date}"
    user_agent: "palazzo-hatogaya-predictor/1.0 (personal research)"
    request_interval_sec: 3      # サーバ負荷を避けるためのリクエスト間隔
    timeout_sec: 20
