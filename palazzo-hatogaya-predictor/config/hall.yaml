# =============================================================================
# ホール設定 (Hall Configuration) — パラッツォ鳩ヶ谷 / AT機専用
# =============================================================================
# 対象ホールの基本情報・判別しきい値・傾向・立ち回りパラメータ・データソース。
# 傾向値は初期仮説で、実データが溜まると hall_analyzer が学習して補正します。
# =============================================================================

hall:
  id: palazzo_hatogaya
  name: "パラッツォ鳩ヶ谷"
  area: "埼玉県川口市"
  open_hour: 9
  close_hour: 22.75      # 22:45 閉店想定（分は小数: 45/60=0.75）
  typical_full_day_games: 8000

# -----------------------------------------------------------------------------
# 判別・推薦のしきい値
# -----------------------------------------------------------------------------
thresholds:
  likely_high_p: 0.55        # 「設定示唆」= P(設定4以上) がこれ以上
  super_hot_p: 0.45          # 「激アツ」= P(設定5以上) がこれ以上
  super_hot_max6_p: 0.30     # 「激アツ」= P(設定6) がこれ以上（OR条件）
  reliable_games: 6000       # 統計的に信頼できる総回転数（AT機は初当たりが重いので高め）
  watch_pattern_score: 0.5   # 事前予想で「注目」とする最低スコア

# -----------------------------------------------------------------------------
# 立ち回り（Tachimawari）パラメータ
# -----------------------------------------------------------------------------
strategy:
  # 移動プランのスコア重み（合計1.0目安）
  weight_setting: 0.5        # 当たりの軽さ＝高設定期待度の重み
  weight_state: 0.3          # 現在の状態（ハマり具合・天井距離）の重み
  weight_ev: 0.2             # 残り期待差枚の重み
  # 「はまってない＝浅い」とみなす天井比（この比率未満なら“まだ浅い/軽い”）
  shallow_ratio: 0.35
  # 天井接近とみなす天井比（この比率以上で“天井狙い”フラグ）
  ceiling_near_ratio: 0.70
  # 期待差枚の正規化スケール（この枚数で ev_score≈1）
  ev_scale: 1500
  # 移動推奨とする move_score の下限
  move_recommend_score: 0.58
  # 撤退候補: P(高設定) がこの値未満 かつ 残り期待差枚がマイナス
  bail_high_p: 0.22
  # 朝一プランで提示する台数
  morning_top_n: 8

# -----------------------------------------------------------------------------
# ホール傾向の初期仮説（学習前デフォルト）
# -----------------------------------------------------------------------------
tendencies:
  last_digit_bias_weight: 0.6
  repdigit_bias_weight: 0.7
  corner_bias_weight: 0.5
  flagship_model_weight: 0.6

  # 看板・強め機種（このホールで設定投入されやすいと仮定するAT機）
  flagship_models:
    - smash_hokuto
    - monkey_turn_5

  # シマ（島）定義: 台番号レンジ + 設置機種。角台判定・ロスター構築に使用。
  islands:
    - name: "スマスロ・バラエティ島A"
      range: [201, 216]
      models: [smash_hokuto, monkey_turn_5]
    - name: "スマスロ・バラエティ島B"
      range: [221, 236]
      models: [okidoki_gold, bancho_zero]
    - name: "スマスロ・バラエティ島C"
      range: [241, 256]
      models: [tensura, godzilla_eva]

# -----------------------------------------------------------------------------
# データソース設定
# -----------------------------------------------------------------------------
data_source:
  # kind: demo | file | web
  kind: demo

  file:
    path: "data/raw/{date}.csv"

  web:
    # ⚠️ 対象サイトの robots.txt / 利用規約を必ず確認。順守は利用者責任。
    enabled: false
    url: ""
    user_agent: "palazzo-hatogaya-predictor/1.0 (personal research)"
    request_interval_sec: 3
    timeout_sec: 20
