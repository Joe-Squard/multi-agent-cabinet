# =============================================================================
# 機種スペック定義 (Machine Specifications) — AT機 / スマスロ 専用
# =============================================================================
# 本システムは AT機（スマスロ含む）専用です。ジャグラー等のAタイプは対象外。
#
# AT機の設定判別は「初当たり確率(hatsuatari)」の設定差を主軸に、ベイズ推定します。
# （Aタイプのブドウ/REGのような小役カウントに頼らず、初当たりの重さで判別）
#
# 各 indicator の値は「確率の分母」です（例: 1/300 → 300）。
#   hatsuatari … AT/ボーナス初当たり合算確率（設定差の主軸）
#   cz         … CZ（チャンスゾーン）初当たり確率（あれば補助判別に使用）
#
# 立ち回り用フィールド:
#   ceiling_games … 天井（ハマりG数の上限。到達で当選が確定/濃厚）
#   zones         … 当たりが集中しやすいゾーン [[開始G, 終了G], ...]（任意）
#   payout        … 機械割(%)。期待値計算に使用。
#
# ⚠️ 重要: 数値は「参考値（一般的な公表値の近似）」です。実運用前に必ず最新の
#   公式スペック / 信頼できる解析値へ更新してください（YAMLなのでコード変更不要）。
# =============================================================================

