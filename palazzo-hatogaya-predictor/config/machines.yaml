# =============================================================================
# 機種スペック定義 (Machine Specifications)
# =============================================================================
# ベイズ設定判別に使う「設定差のある確率」を定義します。
#
# 各 indicator の値は「確率の分母」です（例: 1/273.1 → 273.1）。
# 設定1〜6で単調に変化する指標ほど判別精度が高くなります。
#
# ⚠️ 重要: ここに記載の数値は「参考値（一般に公表されている近似値）」です。
#   実運用では必ず公式スペック / 信頼できる解析サイトの最新値で更新してください。
#   値は YAML なのでコードを変更せずに差し替え可能です。
#
# type:
#   A     … Aタイプ（ノーマル機）。ボーナス確率とブドウで判別しやすい。
#   AT    … AT/ART機。小役・CZ確率などで判別（設定差が読みにくい）。
#
# indicators:
#   big   … BIGボーナス確率（分母）
#   reg   … REGボーナス確率（分母）← ジャグラー系で最重要の設定差
#   grape … ブドウ確率（分母）← カウントできれば強力
# payout: 機械割（%）。期待値計算に使用。
# =============================================================================

